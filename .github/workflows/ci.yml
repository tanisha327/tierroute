name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # TierRoute is standard library only, so there is nothing to install.
      # The suite is plain unittest; `python -m pytest tests` also works locally.
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff~=0.15.0"
      - name: Check for lint errors
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every picture linked from the README exists
        run: |
          python - <<'PY'
          import pathlib, re, sys

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          links = re.findall(r"!\[[^\]]*\]\(([^)]+)\)", readme)
          missing = [link for link in links if not pathlib.Path(link).exists()]
          for link in missing:
              print(f"README links a picture that is not in the repo: {link}")
          print(f"checked {len(links)} picture link(s)")
          sys.exit(1 if missing else 0)
          PY
      - name: The screenshot script still compiles
        run: python -m py_compile docs/annotate_screenshots.py
